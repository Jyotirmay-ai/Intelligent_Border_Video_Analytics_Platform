services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: ibvap-postgres
    environment:
      POSTGRES_USER: ibvap_user
      POSTGRES_PASSWORD: ibvap_password
      POSTGRES_DB: ibvap_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ibvap-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:




